[project]
name = "complainai"
version = "1.0.0"
description = "ComplainAI - AI-Powered Smart Complaint Classification and Priority Prediction System"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.35",
    "scikit-learn>=1.5.0",
    "numpy>=2.0.0",
    "joblib>=1.4.0",
    "python-jose>=3.3.0",
    "bcrypt>=4.2.0",
    "email-validator>=2.2.0"
]

[tool.vercel]
entrypoint = "backend.main:app"

