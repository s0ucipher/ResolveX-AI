services:
  - type: web
    name: complainai-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    region: oregon
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: DATABASE_URL
        fromDatabase:
          name: complainai-postgres
          property: connectionString

databases:
  - name: complainai-postgres
    plan: free
    region: oregon
    databaseName: complainai_db
    user: complainai_user
